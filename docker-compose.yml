# PDFLinker – self-hosted stack: app + MongoDB + S3-compatible object storage + HTTPS proxy.
#
#   cp deploy/.env.docker.example .env      # then edit it
#   docker compose up -d --build
#
# Needs three DNS names pointing at this server (see README → "Deploy on your own server").
# Object storage is SeaweedFS (Apache-2.0, actively maintained). MinIO's open-source edition
# was archived and no longer receives security fixes, so it is deliberately not used.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN}
      S3_BUCKET: ${S3_BUCKET:-pdflinker}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - seaweed

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      APP_URL: https://${APP_DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongo:27017/pdflinker?authSource=admin
      # --- object storage (S3 API). Server-side calls use the internal address; browsers upload
      # --- through the public S3 hostname that Caddy exposes.
      STORAGE_ENDPOINT: http://seaweed:8333
      STORAGE_PUBLIC_ENDPOINT: https://${S3_DOMAIN}
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: "true"
      R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      R2_BUCKET_NAME: ${S3_BUCKET:-pdflinker}
      R2_PUBLIC_DOMAIN: ${FILES_DOMAIN}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      MAX_FILES_PER_BATCH: ${MAX_FILES_PER_BATCH:-100}
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-4}
      ALLOWED_EXTENSION_ORIGINS: ${ALLOWED_EXTENSION_ORIGINS:-}

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweed:
    image: chrislusf/seaweedfs:latest # pin a specific version for production, e.g. chrislusf/seaweedfs:4.54
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./deploy/seaweed-entrypoint.sh:/entrypoint.sh:ro
      - seaweed_data:/data
    # Not published to the host: only Caddy and the app reach it over the internal network.

  s3-init:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      - seaweed
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-pdflinker}
      S3_ENDPOINT: http://seaweed:8333
    volumes:
      - ./deploy/s3-init.sh:/init.sh:ro

  # Aborts abandoned multipart uploads (closed tabs, lost connections) every hour.
  cleanup:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 3600
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/v1/uploads/cleanup || true
        done

volumes:
  mongo_data:
  seaweed_data:
  caddy_data:
  caddy_config:
